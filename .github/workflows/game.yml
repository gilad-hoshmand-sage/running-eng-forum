# Builds the game and deploys it to its static hosts (D-14).
# Hosts: GitHub Pages. Cloudflare is added by T-031 / T-032.
name: game

on:
  push:
    branches: [main]
    paths:
      - 'apps/game/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/game.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: game-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Label this deployment
        run: |
          jq '.deploymentLabel = "github-pages"' apps/game/dist/config.json > config.tmp
          mv config.tmp apps/game/dist/config.json
          cat apps/game/dist/config.json apps/game/dist/version.json
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/game/dist

  deploy-github-pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
